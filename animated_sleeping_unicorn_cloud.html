        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap');

        * { font-family: "Quicksand", system-ui, -apple-system, sans-serif; }

        .dream-float {
          animation: dreamFloat 4s ease-in-out infinite;
          will-change: transform;
          transform-origin: 50% 50%;
        }
        @keyframes dreamFloat {
          0%, 100% { transform: translateY(0px) scale(1); }
          15% { transform: translateY(-4px) scale(1.015); }
          35% { transform: translateY(-11px) scale(1.028); }
          55% { transform: translateY(-14px) scale(1.022); }
          75% { transform: translateY(-7px) scale(1.012); }
        }

        /* Light rays */
        .ray {
          position: absolute;
          top: -8%;
          width: 90px;
          height: 125%;
          background: linear-gradient(to bottom, rgba(255,255,255,0.55) 0%, rgba(255,235,248,0.22) 22%, rgba(255,255,255,0.06) 48%, transparent 78%);
          filter: blur(14px);
          transform-origin: top center;
          mix-blend-mode: screen;
          opacity: 0.7;
        }
        .ray-1 { left: 18%; transform: rotate(-14deg); animation: rayPulse 5.5s ease-in-out infinite; }
